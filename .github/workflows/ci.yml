name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Sem --prefer-offline: o xlsx vem do cdn.sheetjs.com, nao do registro npm.
      - name: Instalar dependencias
        run: npm ci

      - name: Checagem de tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npx vitest run

      - name: Build
        run: npm run build
