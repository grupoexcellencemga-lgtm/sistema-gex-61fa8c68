project_id = "nsxigkgfvbzhpxrpwvhw"

# Estava exposta publicamente: respondia 200 sem nenhuma autenticacao, e ela
# dispara mensagem de WhatsApp para lead. Os chamadores reais (cron e
# webhook-whatsapp) mandam Authorization: Bearer, entao exigir JWT nao quebra
# nada. O trigger trg_bot_ativo manda so 'apikey', mas ja estava morto de outra
# forma: app.settings.edge_function_url nunca foi configurado.
[functions.processar-bot]
# O endpoint valida service role ou segredo rotativo do Vault no próprio código.
# O cron do Postgres não possui um JWT privado disponível no gateway.
verify_jwt = false

[functions.chat]
enabled = true
verify_jwt = false
import_map = "./functions/chat/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/chat/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/chat/*.html" ]
